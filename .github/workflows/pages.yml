name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secret scan (blocks the release if a key or password is committed)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
      - name: Dependency check (blocks on critical issues in shipped packages)
        run: npm audit --omit=dev --audit-level=critical
      - run: npm test
      - name: Data lock check (nothing readable or writable without signing in)
        run: node scripts/live-security-check.mjs --data-only
      - name: Build (repo variables, if set, override .env.production)
        run: |
          if [ -n "${{ vars.VITE_SUPABASE_URL }}" ]; then export VITE_SUPABASE_URL="${{ vars.VITE_SUPABASE_URL }}"; fi
          if [ -n "${{ vars.VITE_SUPABASE_ANON_KEY }}" ]; then export VITE_SUPABASE_ANON_KEY="${{ vars.VITE_SUPABASE_ANON_KEY }}"; fi
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Live security check
        run: |
          for i in 1 2 3 4 5 6; do node scripts/live-security-check.mjs && exit 0; sleep 30; done; exit 1
